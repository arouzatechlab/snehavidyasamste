<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 – Page Not Found | SNEHA VIDYA SAMSTE</title>
    <meta
      name="description"
      content="The page you are looking for could not be found."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --abtprimarypurple: #4c1d95;
        --abtprimarylight: #6d28d9;
        --abtsoftlavender: #c4b5fd;
        --abtaccentgold: #fbbf24;
        --abtaccentgoldhover: #f59e0b;
        --abttextdark: #1f2937;
        --abttextmuted: #4b5563;
        --abtbglight: #faf9fd;
        --abtwhite: #ffffff;
        --abtshadowpremium: 0 10px 30px -5px rgba(76, 29, 149, 0.08);
        --abtshadowglow: 0 0 15px rgba(251, 191, 36, 0.3);
        --abtfontsans: "Inter", sans-serif;
        --abtfontserif: "Playfair Display", serif;
        --abttransitionsmooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);

        --abtradius: 16px;
        --abtradiusbtn: 50px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--abtfontsans);
        color: var(--abttextdark);
        background: var(--abtbglight);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        position: relative;
        overflow-x: hidden;
      }

      /* Subtle ambient background glow */
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.45;
        pointer-events: none;
        z-index: 0;
      }

      body::before {
        width: 260px;
        height: 260px;
        background: var(--abtsoftlavender);
        top: -90px;
        left: -90px;
      }

      body::after {
        width: 300px;
        height: 300px;
        background: rgba(251, 191, 36, 0.22);
        bottom: -120px;
        right: -110px;
      }

      /* ================= HEADER ================= */
      .site-header {
        position: relative;
        z-index: 2;
        background: linear-gradient(
          135deg,
          var(--abtprimarypurple) 0%,
          var(--abtprimarylight) 100%
        );
        padding: 1rem 1rem;
        text-align: center;
        box-shadow: var(--abtshadowpremium);
      }

      .site-header::after {
        content: "";
        display: block;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--abtaccentgold),
          transparent
        );
      }

      .site-header .school-name {
        font-family: var(--abtfontserif);
        font-weight: 800;
        font-size: clamp(1rem, 4.2vw, 1.35rem);
        letter-spacing: 0.05em;
        color: var(--abtwhite);
        text-transform: uppercase;
        line-height: 1.25;
      }

      .site-header .school-name .accent {
        color: var(--abtaccentgold);
      }

      /* ================= MAIN ================= */
      main {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem 2.5rem;
      }

      .error-card {
        width: 100%;
        max-width: 620px;
        background: var(--abtwhite);
        border-radius: var(--abtradius);
        box-shadow: var(--abtshadowpremium);
        padding: 2.25rem 1.25rem 2.5rem;
        text-align: center;
        position: relative;
        overflow: hidden;
        animation: abtFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        border: 1px solid rgba(196, 181, 253, 0.4);
      }

      @keyframes abtFadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Decorative corner accent */
      .error-card::before {
        content: "";
        position: absolute;
        top: -50px;
        right: -50px;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(251, 191, 36, 0.28) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      /* ================= 404 NUMBER ================= */
      .error-code {
        font-family: var(--abtfontserif);
        font-weight: 800;
        font-size: clamp(4.75rem, 27vw, 9rem);
        line-height: 0.85;
        letter-spacing: -0.04em;
        color: var(--abtprimarypurple);
        margin: 0.25rem 0 0.6rem;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.04em;
      }

      .error-code .zero {
        color: var(--abtaccentgold);
        display: inline-block;
        text-shadow: var(--abtshadowglow);
        animation: abtPulse 3.2s ease-in-out infinite;
      }

      @keyframes abtPulse {
        0%,
        100% {
          transform: scale(1);
          text-shadow: var(--abtshadowglow);
        }
        50% {
          transform: scale(1.06);
          text-shadow: 0 0 25px rgba(251, 191, 36, 0.55);
        }
      }

      /* ================= TEXT ================= */
      .error-title {
        font-family: var(--abtfontserif);
        font-weight: 700;
        font-size: clamp(1.25rem, 5.4vw, 1.75rem);
        color: var(--abttextdark);
        margin-bottom: 0.6rem;
        line-height: 1.25;
      }

      .error-title .underline {
        position: relative;
        display: inline-block;
        color: var(--abtprimarypurple);
      }

      .error-title .underline::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -4px;
        transform: translateX(-50%);
        width: 60%;
        height: 3px;
        background: var(--abtaccentgold);
        border-radius: 3px;
      }

      .error-text {
        font-size: clamp(0.9rem, 3.7vw, 1.02rem);
        color: var(--abttextmuted);
        line-height: 1.7;
        max-width: 44ch;
        margin: 0 auto 1.85rem;
        font-weight: 400;
      }

      .error-text .path-highlight {
        display: inline-block;
        max-width: 100%;
        overflow-wrap: anywhere;
        background: var(--abtbglight);
        border: 1px dashed var(--abtsoftlavender);
        color: var(--abtprimarylight);
        font-weight: 600;
        font-size: 0.85em;
        padding: 0.2em 0.65em;
        border-radius: 8px;
        margin-top: 0.5rem;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      }

      /* ================= BUTTONS ================= */
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        width: 100%;
        align-items: stretch;
      }

      .btn {
        font-family: var(--abtfontsans);
        font-weight: 600;
        font-size: 0.9rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        padding: 1rem 1.4rem;
        border-radius: var(--abtradiusbtn);
        border: 2px solid transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        width: 100%;
        transition: var(--abttransitionsmooth);
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .btn svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        transition: transform var(--abttransitionsmooth);
      }

      /* Primary: Home */
      .btn-home {
        background: linear-gradient(
          135deg,
          var(--abtprimarypurple) 0%,
          var(--abtprimarylight) 100%
        );
        color: var(--abtwhite);
        box-shadow: 0 8px 22px -6px rgba(76, 29, 149, 0.55);
        position: relative;
        overflow: hidden;
      }

      .btn-home::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          var(--abtprimarylight) 0%,
          var(--abtprimarypurple) 100%
        );
        opacity: 0;
        transition: var(--abttransitionsmooth);
      }

      .btn-home > * {
        position: relative;
        z-index: 1;
      }

      .btn-home:hover,
      .btn-home:focus-visible {
        transform: translateY(-3px);
        box-shadow:
          0 14px 28px -8px rgba(76, 29, 149, 0.6),
          0 0 0 4px rgba(196, 181, 253, 0.35);
        outline: none;
      }

      .btn-home:hover::before,
      .btn-home:focus-visible::before {
        opacity: 1;
      }

      .btn-home:active {
        transform: translateY(-1px);
      }

      .btn-home:hover svg {
        transform: translateX(4px);
      }

      /* Secondary: Back */
      .btn-back {
        background: transparent;
        color: var(--abtprimarypurple);
        border-color: var(--abtsoftlavender);
      }

      .btn-back:hover,
      .btn-back:focus-visible {
        background: rgba(196, 181, 253, 0.15);
        border-color: var(--abtprimarylight);
        color: var(--abtprimarylight);
        transform: translateY(-3px);
        box-shadow: 0 10px 22px -10px rgba(76, 29, 149, 0.25);
        outline: none;
      }

      .btn-back:hover svg {
        transform: translateX(-4px);
      }

      .btn-back:active {
        transform: translateY(-1px);
      }

      /* Gold accent focus ring for accessibility */
      .btn:focus-visible {
        box-shadow: 0 0 0 3px var(--abtaccentgold);
      }

      /* ================= FOOTER ================= */
      .site-footer {
        position: relative;
        z-index: 2;
        background: var(--abtprimarypurple);
        color: var(--abtsoftlavender);
        text-align: center;
        padding: 1.15rem 1rem;
        font-size: 0.78rem;
        letter-spacing: 0.03em;
      }

      .site-footer .footer-inner {
        opacity: 0.95;
      }

      .site-footer .accent {
        color: var(--abtaccentgold);
        font-weight: 600;
      }

      /* ================= TABLET / DESKTOP ================= */
      @media (min-width: 480px) {
        .error-card {
          padding: 2.75rem 2rem 3rem;
        }

        .error-code {
          margin-top: 0.4rem;
        }
      }

      @media (min-width: 640px) {
        .site-header {
          padding: 1.2rem 1.5rem;
        }

        main {
          padding: 3rem 1.5rem;
        }

        .btn-group {
          flex-direction: row;
          justify-content: center;
          gap: 1rem;
        }

        .btn {
          width: auto;
          min-width: 200px;
          padding: 1.05rem 1.75rem;
          font-size: 0.92rem;
        }

        .error-card {
          padding: 3rem 2.75rem 3.25rem;
        }

        .error-text {
          margin-bottom: 2rem;
        }
      }

      @media (min-width: 1024px) {
        .error-card {
          max-width: 680px;
          padding: 3.5rem 3.25rem 3.75rem;
        }
      }

      /* ================= REDUCED MOTION ================= */
      @media (prefers-reduced-motion: reduce) {
        .error-card,
        .error-code .zero {
          animation: none;
        }
        .btn,
        .btn svg {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================= HEADER ================= -->
    <header class="site-header">
      <p class="school-name">Sneha <span class="accent">Vidya</span> Samste</p>
    </header>

    <!-- ================= MAIN ================= -->
    <main>
      <section class="error-card" role="alert" aria-labelledby="error-title">
        <div class="error-code" aria-hidden="true">
          <span>4</span><span class="zero">0</span><span>4</span>
        </div>

        <h1 id="error-title" class="error-title">
          Oops! <span class="underline">Page Not Found</span>
        </h1>

        <p class="error-text">
          The page you're looking for may have been moved, removed, or never
          existed. Please check the URL, or use the buttons below to continue.
          <br />
          <span class="path-highlight" id="requestedPath"></span>
        </p>

        <div class="btn-group">
          <a href="/" class="btn btn-home" aria-label="Go to home page">
            <span>Go to Home</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 9.5 12 3l9 6.5" />
              <path d="M5 10v10h14V10" />
            </svg>
          </a>

          <button
            type="button"
            class="btn btn-back"
            id="goBackBtn"
            aria-label="Go back to previous page"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M19 12H5" />
              <path d="m12 19-7-7 7-7" />
            </svg>
            <span>Go Back</span>
          </button>
        </div>
      </section>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">
      <div class="footer-inner">
        &copy; <span id="year"></span>
        <span class="accent">Sneha Vidya Samste</span> · All Rights Reserved
      </div>
    </footer>

    <script>
      // Dynamic year
      document.getElementById("year").textContent = new Date().getFullYear();

      // Show the invalid path (if any) inside the pill
      (function () {
        var path = window.location.pathname + window.location.search;
        if (path && path !== "/" && path !== "/404.html") {
          document.getElementById("requestedPath").textContent = path;
        } else {
          document.getElementById("requestedPath").style.display = "none";
        }
      })();

      // "Go Back" — history-aware with home fallback
      document
        .getElementById("goBackBtn")
        .addEventListener("click", function () {
          if (window.history.length > 1 && document.referrer) {
            window.history.back();
          } else {
            window.location.href = "/";
          }
        });
    </script>
  </body>
</html>
